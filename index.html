<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>حلو الملك | لوحة التحكم</title>

  <!-- خط Tajawal -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- الأنماط (الترتيب مهم) -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- الشريط الجانبي: الأزرار بتتعمل من nav.js -->
  <aside>
    <div class="logo">حلو الملك</div>
    <nav id="nav"></nav>
  </aside>

  <main>
    <!-- الشريط العلوي: ترحيب + بحث + إشعارات -->
    <div class="top">
      <div>
        <h1>أهلًا، أحمد</h1>
        <p id="sub">ملخص الأداء اليوم</p>
      </div>

      <div class="tools">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input id="q" placeholder="ابحث في الطلبات">
        </label>

        <button class="bell" id="bell" aria-label="الإشعارات">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>
          </svg>
          <i id="badge">3</i>
        </button>

        <div class="drop" id="drop"></div>
      </div>
    </div>

    <!-- هنا بيتحط محتوى الصفحة (الرئيسية أو الجداول) -->
    <div id="view"></div>
  </main>

  <!-- رسالة التأكيد -->
  <div class="toast" id="toast"></div>

  <!-- السكريبتات (الترتيب مهم: البيانات أولًا و app.js أخيرًا) -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
